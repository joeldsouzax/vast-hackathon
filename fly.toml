# Replace the app name or pass --app to every Fly command.
app = "breadcast-media"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"
  build-target = "cloud-runtime"

[deploy]
  strategy = "immediate"

[env]
  BREADCAST_BIND = "0.0.0.0"
  BREADCAST_PORT = "8080"
  BREADCAST_PROVIDER_STACK = "gemini-supabase"
  BREADCAST_SERVER_VIDEOS_CONFIG = "/opt/breadcast/config/server-videos.json"
  BREADCAST_WEBRTC_PORT = "8189"
  BREADCAST_WEBRTC_UDP_BIND = "fly-global-services"
  BREADCAST_CREW_MODE = "automatic"
  BREADCAST_SPEECH = "on"

[[mounts]]
  source = "breadcast_runtime"
  destination = "/var/lib/breadcast-studio"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[services]]
  protocol = "tcp"
  internal_port = 8189
  [[services.ports]]
    port = 8189

[[services]]
  protocol = "udp"
  internal_port = 8189
  [[services.ports]]
    port = 8189

[[vm]]
  memory = "4gb"
  cpus = 2
  cpu_kind = "shared"

[[restart]]
  policy = "never"
