<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img"><title>Breadcast five-camera architecture overview</title><rect x="0" y="0" width="1600" height="1110" rx="0" fill="#F5F2EB"/><text x="60" y="70" fill="#111C2C" font-size="34" font-weight="700" font-family="Arial, sans-serif">BREADCAST</text><text x="60" y="111" fill="#516072" font-size="26" font-weight="400" font-family="Arial, sans-serif">Live broadcast with up to five QR-connected cameras</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#61768A"/></marker></defs><text x="60" y="158" fill="#657487" font-size="18" font-weight="700" font-family="Arial, sans-serif">01 / PREPARE THE EVENT</text><rect x="60" y="180" width="280" height="102" rx="12" fill="#111C2C"/><text x="80" y="218" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Event context</text><text x="80" y="253" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Profile, names, rules</text><rect x="420" y="180" width="280" height="102" rx="12" fill="#111C2C"/><text x="440" y="218" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Graphics package</text><text x="440" y="253" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Render and preload</text><rect x="800" y="180" width="280" height="102" rx="12" fill="#111C2C"/><text x="820" y="218" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Program controller</text><text x="820" y="253" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">One on-air authority</text><rect x="1160" y="180" width="340" height="102" rx="12" fill="#111C2C"/><text x="1180" y="218" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Operator controls</text><text x="1180" y="253" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Start, override, return to live</text><path d="M340 231H420" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M700 231H800" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M1160 231H1080" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="348" fill="#657487" font-size="18" font-weight="700" font-family="Arial, sans-serif">02 / KEEP MEDIA PLAYING</text><rect x="60" y="370" width="235" height="102" rx="12" fill="#111C2C"/><text x="80" y="408" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Up to five phones</text><text x="80" y="443" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">QR join + permission</text><rect x="350" y="370" width="235" height="102" rx="12" fill="#111C2C"/><text x="370" y="408" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Media gateway</text><text x="370" y="443" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Admission + health</text><rect x="640" y="370" width="235" height="102" rx="12" fill="#111C2C"/><text x="660" y="408" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Rolling buffers</text><text x="660" y="443" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Aligned source time</text><rect x="930" y="370" width="235" height="102" rx="12" fill="#111C2C"/><text x="950" y="408" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Compositor</text><text x="950" y="443" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Video, graphics, audio</text><rect x="1220" y="370" width="280" height="102" rx="12" fill="#111C2C"/><text x="1240" y="408" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Viewer output</text><text x="1240" y="443" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">One continuous show</text><path d="M295 421H350" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M585 421H640" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M875 421H930" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M1165 421H1220" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M940 282V318H1047V370" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="545" width="1480" height="460" rx="18" fill="#E8E4DC"/><text x="60" y="580" fill="#657487" font-size="18" font-weight="700" font-family="Arial, sans-serif">03 / ANALYZE AND PREPARE WITHOUT BLOCKING PLAYBACK</text><rect x="60" y="615" width="260" height="102" rx="12" fill="#111C2C"/><text x="80" y="653" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">VAST DataEngine</text><text x="80" y="688" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Finalized objects + jobs</text><rect x="390" y="615" width="260" height="102" rx="12" fill="#111C2C"/><text x="410" y="653" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Cosmos + YOLO</text><text x="410" y="688" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Reasoning and tracks</text><rect x="720" y="615" width="260" height="102" rx="12" fill="#111C2C"/><text x="740" y="653" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Evidence + search</text><text x="740" y="688" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Timed scenes and recall</text><rect x="1050" y="615" width="330" height="102" rx="12" fill="#111C2C"/><text x="1070" y="653" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Director / W&amp;B LLM</text><text x="1070" y="688" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Propose eligible program cues</text><path d="M757 472V516H25V666H60" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 666H390" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 666H720" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 666H1050" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M1380 666H1545V153H940V180" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="810" width="260" height="102" rx="12" fill="#111C2C"/><text x="410" y="848" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Segmentor</text><text x="410" y="883" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Interval, speed, crop</text><rect x="720" y="810" width="260" height="102" rx="12" fill="#111C2C"/><text x="740" y="848" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Media renderer</text><text x="740" y="883" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Render + validate</text><rect x="1050" y="810" width="330" height="102" rx="12" fill="#111C2C"/><text x="1070" y="848" fill="#FFF9EE" font-size="24" font-weight="700" font-family="Arial, sans-serif">Ready replay asset</text><text x="1070" y="883" fill="#C9D3DE" font-size="18" font-weight="400" font-family="Arial, sans-serif">Director schedules playback</text><path d="M850 717V764H520V810" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 861H720" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M980 861H1050" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><path d="M1215 810V717" fill="none" stroke="#61768A" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="958" fill="#516072" font-size="23" font-weight="400" font-family="Arial, sans-serif">All live cameras keep recording while a replay airs. Return to the current delayed live position.</text><text x="60" y="1050" fill="#516072" font-size="22" font-weight="400" font-family="Arial, sans-serif">Commentary follows accepted program cues. Captions or optional TTS are mixed by the compositor.</text><text x="60" y="1086" fill="#657487" font-size="18" font-weight="400" font-family="Arial, sans-serif">Proposed architecture • Detailed timing, fallback, and source contracts are in the linked docs.</text></svg>
