mily="Arial, sans-serif">BREADCAST</text><text x="152" y="375" fill="#6ED6CC" font-size="30" font-weight="700" font-family="Arial, sans-serif">BROADCAST PAUSED</text><text id="headline" x="152" y="516" fill="#FFF9EE" font-size="98" font-weight="700" font-family="Arial, sans-serif">We will be right back.</text><text id="subtitle" x="152" y="615" fill="#A6B5C8" font-size="40" font-weight="400" font-family="Arial, sans-serif">Restoring the camera connection</text><rect x="152" y="865" width="1616" height="2" rx="0" fill="#344153"/><text id="footer" x="152" y="935" fill="#A6B5C8" font-size="24" font-weight="400" font-family="Arial, sans-serif">CAMPUS CUP  /  SAMPLE EVENT</text></svg><text x="60" y="519" fill="#111C2C" font-size="20" font-weight="700" font-family="Arial, sans-serif">CLOSING</text><svg x="60" y="539" width="710" height="300" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111C2C"/><rect x="96" y="120" width="12" height="840" rx="0" fill="#FF784F"/><text x="152" y="198" fill="#FF784F" font-size="32" font-weight="700" font-family="Arial, sans-serif">BREADCAST</text><text x="152" y="375" fill="#6ED6CC" font-size="30" font-weight="700" font-family="Arial, sans-serif">THANK YOU FOR WATCHING</text><text id="headline" x="152" y="516" fill="#FFF9EE" font-size="98" font-weight="700" font-family="Arial, sans-serif">That is the final whistle.</text><text id="subtitle" x="152" y="615" fill="#A6B5C8" font-size="40" font-weight="400" font-family="Arial, sans-serif">Campus Cup  /  Breadcast</text><rect x="152" y="865" width="1616" height="2" rx="0" fill="#344153"/><text id="footer" x="152" y="935" fill="#A6B5C8" font-size="24" font-weight="400" font-family="Arial, sans-serif">CAMPUS CUP  /  SAMPLE EVENT</text></svg><text x="830" y="519" fill="#111C2C" font-size="20" font-weight="700" font-family="Arial, sans-serif">SCOREBUG</text><svg x="830" y="539" width="710" height="300" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height