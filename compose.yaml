name: breadcast
services:
  studio:
    image: breadcast-studio:latest
    build:
      context: .
      args:
        DOCKER_BUILDKIT: 1
      dockerfile: Dockerfile
      target: runtime
    container_name: breadcast-studio
    ports:
      - "${BREADCAST_HTTP_BIND:-0.0.0.0}:${BREADCAST_HTTP_PORT:-8080}:${BREADCAST_PORT:-8080}"
      - "${BREADCAST_WEBRTC_PORT:-8189}:${BREADCAST_WEBRTC_PORT:-8189}/tcp"
      - "${BREADCAST_WEBRTC_PORT:-8189}:${BREADCAST_WEBRTC_PORT:-8189}/udp"
    environment:
      BREADCAST_PUBLIC_URL: ${BREADCAST_PUBLIC_URL:?Set BREADCAST_PUBLIC_URL to the reachable browser origin}
      BREADCAST_ICE_HOSTS: ${BREADCAST_ICE_HOSTS:-}
      BREADCAST_BIND: ${BREADCAST_BIND:-0.0.0.0}
      BREADCAST_PORT: ${BREADCAST_PORT:-8080}
      BREADCAST_WEBRTC_PORT: ${BREADCAST_WEBRTC_PORT:-8189}
      BREADCAST_DELAY: ${BREADCAST_DELAY:-3}
      BREADCAST_RESERVATION_SECONDS: ${BREADCAST_RESERVATION_SECONDS:-60}
      BREADCAST_RECONNECT_SECONDS: ${BREADCAST_RECONNECT_SECONDS:-20}
      BREADCAST_FOUNDATION_CONFIG: ${BREADCAST_FOUNDATION_CONFIG:-}
      BREADCAST_ICE_SERVERS: ${BREADCAST_ICE_SERVERS:-}
      BREADCAST_TLS_CERT: ${BREADCAST_TLS_CERT:-}
      BREADCAST_TLS_KEY: ${BREADCAST_TLS_KEY:-}
    stop_grace_period: 60s
    restart: "no"
