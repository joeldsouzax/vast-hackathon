name: breadcast
services:
  studio:
    image: breadcast-studio:latest
    build:
      context: .
      args:
        DOCKER_BUILDKIT: 1
      dockerfile: Dockerfile
      target: runtime
    container_name: breadcast-studio
    ports:
      - "${BREADCAST_HTTP_BIND:-0.0.0.0}:${BREADCAST_HTTP_PORT:-8080}:${BREADCAST_PORT:-8080}"
      - "${BREADCAST_WEBRTC_PORT:-8189}:${BREADCAST_WEBRTC_PORT:-8189}/tcp"
      - "${BREADCAST_WEBRTC_PORT:-8189}:${BREADCAST_WEBRTC_PORT:-8189}/udp"
    environment:
      BREADCAST_PUBLIC_URL: ${BREADCAST_PUBLIC_URL:?Set BREADCAST_PUBLIC_URL to the reachable browser origin}
      BREADCAST_PUBLIC_PATH_PREFIX: ${BREADCAST_PUBLIC_PATH_PREFIX:-}
      BREADCAST_OPERATOR_AUTH: token
      BREADCAST_OPERATOR_TOKEN_FILE: /run/secrets/operator_token
      BREADCAST_RUNTIME: /var/lib/breadcast-studio
      BREADCAST_SERVER_VIDEOS_CONFIG: /opt/breadcast/config/server-videos.json
      BREADCAST_S3_ENDPOINT_URL: ${BREADCAST_S3_ENDPOINT_URL:-}
      INGRESS_URL: ${INGRESS_URL:-}
      USERNAME: ${USERNAME:-}
      PASSWORD: ${PASSWORD:-}
      S3_CHUNKS_BUCKET: ${S3_CHUNKS_BUCKET:-}
      S3_SEGMENTS_BUCKET: ${S3_SEGMENTS_BUCKET:-}
      BREADCAST_STACK_ENABLED: ${BREADCAST_STACK_ENABLED:-auto}
      COSMOS3_REASON_URL: ${COSMOS3_REASON_URL:-}
      COSMOS3_REASON_MODEL: ${COSMOS3_REASON_MODEL:-}
      YOLO_URL: ${YOLO_URL:-}
      COSMOS_EMBED1_URL: ${COSMOS_EMBED1_URL:-}
      COSMOS_EMBED1_MODEL: ${COSMOS_EMBED1_MODEL:-}
      GPU_BEARER_TOKEN: ${GPU_BEARER_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      ACCESS_KEY: ${ACCESS_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      BREADCAST_ICE_HOSTS: ${BREADCAST_ICE_HOSTS:-}
      BREADCAST_BIND: ${BREADCAST_BIND:-0.0.0.0}
      BREADCAST_PORT: ${BREADCAST_PORT:-8080}
      BREADCAST_WEBRTC_PORT: ${BREADCAST_WEBRTC_PORT:-8189}
      BREADCAST_DELAY: ${BREADCAST_DELAY:-3}
      BREADCAST_RESERVATION_SECONDS: ${BREADCAST_RESERVATION_SECONDS:-60}
      BREADCAST_RECONNECT_SECONDS: ${BREADCAST_RECONNECT_SECONDS:-20}
      BREADCAST_FOUNDATION_CONFIG: ${BREADCAST_FOUNDATION_CONFIG:-}
      BREADCAST_ICE_SERVERS: ${BREADCAST_ICE_SERVERS:-}
      BREADCAST_TLS_CERT: ${BREADCAST_TLS_CERT:-}
      BREADCAST_TLS_KEY: ${BREADCAST_TLS_KEY:-}
    secrets:
      - operator_token
    volumes:
      - studio-runtime:/var/lib/breadcast-studio
      - ./.runtime/tls:/run/breadcast/tls:ro
      - ${BREADCAST_SERVER_VIDEOS_CONFIG_SOURCE:-./config/server-videos.json}:/opt/breadcast/config/server-videos.json:ro
    stop_grace_period: 60s
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  operator_token:
    file: ${BREADCAST_OPERATOR_TOKEN_SOURCE:-.runtime/operator-token}

volumes:
  studio-runtime:
