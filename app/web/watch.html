<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breadcast · Broadcast</title><link rel="icon" href="/brand/breadcast-mark.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/public.css"></head>
<body class="studio-page public-page broadcast-page">
<div class="public-scene" aria-hidden="true"><span class="scene-orbit"></span><span class="scene-glow"></span></div>
<header class="studio-header" data-page="broadcast"></header>
<div class="page-intro page-reveal"><div><p class="eyebrow"><span data-icon="radio"></span>THE BROADCAST</p><h1>Every angle. <em>One story.</em></h1></div><p class="intro-note">A front-row seat, wherever you are.</p></div>
<p id="message" class="error studio-message" role="status" hidden></p>
<main id="broadcast" class="studio-workspace page-reveal">
<section class="main-surface" aria-label="Broadcast program">
<div class="program-panel"><div class="monitor-frame"><video id="program" aria-label="Broadcast program" autoplay muted playsinline poster="/brand/holding.png"></video>
<div class="program-toolbar"><div class="monitor-actions" role="group" aria-label="Local viewer controls"><button id="monitor-audio" type="button" aria-label="Listen to program audio" aria-pressed="false" title="Listen in this browser only." data-icon="volume-x"></button><button id="program-fullscreen" type="button" aria-label="Enter fullscreen" title="Expand the program monitor." data-icon="maximize"></button></div></div></div></div>
</section>
<aside class="invitation-card" aria-label="Join as a camera"><div class="invitation-top"><span class="icon-medallion" data-icon="camera" aria-hidden="true"></span><div><h2>Add your angle.</h2><p class="card-caption">Your phone. A new perspective.</p></div></div>
<div class="qr-panel"><img id="qr" alt="Scan to join as a camera" hidden><p id="qr-status" role="status">Loading join code…</p></div>
<a id="join-link" class="join-link" hidden><span data-icon="camera"></span>Join from this device</a><p id="join-hint" class="join-hint"></p>
<div class="invitation-detail"><span data-icon="check"></span>You choose when to start sharing.</div>
</aside></main>
<script src="/vendor/reader.js"></script><script src="/common.js"></script><script src="/broadcast.js"></script></body></html>
